<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optix Pro 架构全图</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0b1016;
  --panel: #121821;
  --panel-2: #181f2a;
  --line: #2a3444;
  --text: #e8eef6;
  --muted: #93a0b4;
  --accent: #4aa3ff;
  --warn: #f5b942;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.55 "WenQuanYi Micro Hei", "Droid Sans Fallback", ui-sans-serif, system-ui, sans-serif; }
a { color: var(--accent); }
header.app {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start;
  padding: 16px 20px 12px; background: linear-gradient(#0b1016f2, #0b1016e6);
  border-bottom: 1px solid var(--line);
}
h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .02em; }
.sub { color: var(--muted); max-width: 78ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); }
.stat b { color: var(--text); }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 20px; border-bottom: 1px solid var(--line); background: #0e141c;
}
.toolbar label { color: var(--muted); font-size: 12px; }
input[type="search"], select {
  background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; min-width: 220px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px;
}
.chip.on { color: #041018; background: var(--accent); border-color: transparent; font-weight: 600; }
.chip[data-rel] { border-left-width: 6px; }
.views { display: flex; gap: 6px; }
.views button {
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.views button.on { background: #1d4d86; border-color: #4aa3ff; }
main.layout { display: grid; grid-template-columns: minmax(0,1fr) 380px; min-height: calc(100vh - 180px); }
#canvasWrap { position: relative; overflow: hidden; border-right: 1px solid var(--line); background:
  radial-gradient(1200px 500px at 10% -10%, #16324f55, transparent), var(--bg); }
svg#map { width: 100%; height: calc(100vh - 210px); cursor: grab; display: block; }
svg#map.drag { cursor: grabbing; }
aside.detail {
  overflow: auto; padding: 16px 18px 32px; background: var(--panel);
}
aside.detail h2 { margin: 0 0 8px; font-size: 18px; }
aside.detail .k { color: var(--muted); font-size: 12px; margin-top: 14px; }
.file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
  background: #0b1016; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.file .q { color: #b7c6d8; margin-top: 4px; }
.edge { margin: 6px 0; padding: 6px 8px; border-left: 3px solid var(--accent); background: #0b1016; }
.hidden { display: none !important; }
#listView, #claimView, #fileView { padding: 18px 22px 40px; }
table { width: 100%; border-collapse: collapse; }
th, td { border-bottom: 1px solid var(--line); text-align: left; padding: 8px 6px; vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px; color: var(--muted); font-size: 12px; }
.legend span { cursor: pointer; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; }
.empty { color: var(--muted); padding: 24px; }
markhit { background: #f5b94255; color: inherit; }
</style>
</head>
<body>
<header class="app">
  <div>
    <h1>Optix Pro 架构全图</h1>
    <div class="sub">单文件交互图：系统模块、职责、连接，以及每条结论对应的源码位置。数据由当前工作树扫描生成，点击节点看详情，用关系芯片筛选连线。</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar">
  <div class="views" id="views">
    <button data-view="map" class="on">系统全图</button>
    <button data-view="list">模块目录</button>
    <button data-view="claims">判断依据</button>
    <button data-view="files">源码覆盖</button>
  </div>
  <label>搜索 <input type="search" id="q" placeholder="模块 / 文件 / 路由 / 任务"></label>
  <label>层级
    <select id="layer">
      <option value="">全部层级</option>
    </select>
  </label>
    <button class="chip on" id="iso" title="只保留与当前节点相邻的边">邻域高亮</button>
    <button class="chip" id="fit">适应宽度</button>
    <button class="chip" id="relDefault">默认关系</button>
    <button class="chip" id="relAll">全部关系</button>
</div>
<div class="toolbar" id="relBar">
  <label>关系筛选</label>
  <div class="chips" id="rels"></div>
</div>
<div class="legend" id="legend"></div>
<main class="layout" id="mapView">
  <div id="canvasWrap">
    <svg id="map"></svg>
  </div>
  <aside class="detail" id="detail">
    <p class="empty">点击图中的模块查看职责、连接和源码依据。滚轮缩放，拖拽平移。</p>
  </aside>
</main>
<section id="listView" class="hidden"></section>
<section id="claimView" class="hidden"></section>
<section id="fileView" class="hidden"></section>

function matchesQuery(m) {
  if (!search) return true;
  const blob = [m.id, m.name, m.summary, m.route, ...(m.endpoints||[]), ...(m.assigned||[])].join(" ").toLowerCase();
  return blob.includes(search);
}

function visibleModules() {
  return DATA.modules.filter(m => (!layerFilter || m.layer === layerFilter) && matchesQuery(m));
}

function visibleEdges() {
  const vis = new Set(visibleModules().map(m => m.id));

}

function neighbors(id) {
  const n = new Set([id]);
  for (const e of DATA.edges) {

    if (e.to === id) n.add(e.from);

function layout() {
  const layers = DATA.layers.map(l => l[0]);

  for (const m of DATA.modules) grouped.get(m.layer).push(m);

  const positions = {};

    const cols = Math.min(7, Math.max(3, Math.ceil(Math.sqrt(items.length * 1.8))));
    const rows = Math.ceil(items.length / cols);
    const width = cols * (nodeW + gapX);
    maxW = Math.max(maxW, width + 80);
    bands.push({ layer, y, h: bandPad + rows * (nodeH + gapY) });
    items.forEach((m, i) => {

function pathFor(e) {

function renderDetail(m) {
  if (!m) return;
  const ins = DATA.edges.filter(e => e.to === m.id);
  const outs = DATA.edges.filter(e => e.from === m.id);
  const files = [...new Set([...(m.files||[]), ...(m.assigned||[])])];
  $("detail").innerHTML = `
    <div class="k">层级 · ${DATA.layers.find(l=>l[0]===m.layer)[1]}</div>
    <h2>${m.name}</h2>
    <p>${m.summary}</p>
    ${m.route ? `<p class="k">路由</p><div class="file">${m.route}</div>` : ""}
    ${m.endpoints ? `<p class="k">接口</p>${m.endpoints.map(x=>`<div class="file">${x}</div>`).join("")}` : ""}
    <p class="k">职责判断依据</p>
    ${(m.evidence||[]).map(e => `<div class="file"><div>${e.path}${e.line?":"+e.line:""}</div><div class="q">${e.claim} — ${e.quote||""}</div></div>`).join("") || "<p class='empty'>目录型模块，见文件清单</p>"}
    <p class="k">覆盖源码（${files.length}）</p>
    ${files.slice(0,80).map(f => `<div class="file">${f}</div>`).join("")}
    ${files.length>80?`<p class="empty">还有 ${files.length-80} 个文件</p>`:""}
    <p class="k">进入连接（${ins.length}）</p>
    ${ins.map(e => `<div class="edge"><b>${byId[e.from].name}</b> —${e.type}→ ${e.label||""}</div>`).join("") || "<p class='empty'>无</p>"}
    <p class="k">离开连接（${outs.length}）</p>
    ${outs.map(e => `<div class="edge">${e.label||""} —${e.type}→ <b>${byId[e.to].name}</b></div>`).join("") || "<p class='empty'>无</p>"}
  `;
}

function renderList() {
  const mods = visibleModules();
  const groups = new Map();
  for (const m of mods) {
    if (!groups.has(m.layer)) groups.set(m.layer, []);
    groups.get(m.layer).push(m);
  }
  let html = `<h2>模块目录</h2><p class="sub">当前过滤后 ${mods.length} / ${DATA.modules.length} 个模块。点击名称定位到全图。</p>`;
  for (const [id, name, desc] of DATA.layers) {
    const items = groups.get(id) || [];
    if (!items.length) continue;
    html += `<h3>${name} <span style="color:var(--muted);font-weight:400">${desc}</span></h3><table><tr><th>模块</th><th>职责</th><th>依据</th></tr>`;
    for (const m of items) {
      const ev = (m.evidence||[])[0];
      html += `<tr><td><a href="#" data-jump="${m.id}">${m.name}</a></td><td>${m.summary}</td><td>${ev?`${ev.path}${ev.line?":"+ev.line:""}`:"—"}</td></tr>`;
    }
    html += `</table>`;
  }
  $("listView").innerHTML = html;
}

function renderClaims() {
  let html = `<h2>架构判断依据</h2><p class="sub">每条结论都回溯到源码或受控文档的具体行。文档与源码冲突时以源码为准（例如 Worker 任务数）。</p>`;
  for (const c of DATA.claims) {
    html += `<h3>${c.title}</h3><table><tr><th>文件</th><th>行</th><th>摘录</th><th>说明</th></tr>`;
    for (const e of c.evidence) {
      html += `<tr><td class="file" style="border:0;padding:0">${e.path}</td><td>${e.line||"?"}</td><td>${e.quote||e.snippet}</td><td>${e.note||""}</td></tr>`;
    }
    html += `</table>`;
  }
  $("claimView").innerHTML = html;
}

function renderFiles() {
  const rows = DATA.files.map(f => {
    const owner = DATA.fileOwner[f];
    const m = owner ? byId[owner] : null;
    return `<tr><td>${f}</td><td>${m?m.name:"未归类"}</td><td>${m?DATA.layers.find(l=>l[0]===m.layer)[1]:"—"}</td></tr>`;
  });
  $("fileView").innerHTML = `<h2>源码覆盖</h2>
    <p class="sub">扫描范围内 ${DATA.files.length} 个文件；未归类 ${DATA.unassigned.length} 个（测试夹具/文档配图等允许单独列出）。</p>
    ${DATA.unassigned.length?`<p>未归类：${DATA.unassigned.map(x=>`<code>${x}</code>`).join(" · ")}</p>`:""}
    <table><tr><th>文件</th><th>模块</th><th>层级</th></tr>${rows.join("")}</table>`;
}

function showView(name) {
  view = name;
  for (const btn of $("views").querySelectorAll("button")) btn.classList.toggle("on", btn.dataset.view===name);
  $("mapView").classList.toggle("hidden", name!=="map");
  $("listView").classList.toggle("hidden", name!=="list");
  $("claimView").classList.toggle("hidden", name!=="claims");
  $("fileView").classList.toggle("hidden", name!=="files");
  if (name==="list") renderList();
  if (name==="claims") renderClaims();
  if (name==="files") renderFiles();
}

$("views").onclick = (ev) => {
  const btn = ev.target.closest("button");
  if (btn) showView(btn.dataset.view);
};
$("q").addEventListener("input", (ev) => { search = ev.target.value.trim().toLowerCase(); draw(); if(view==="list") renderList(); });
$("layer").addEventListener("change", (ev) => { layerFilter = ev.target.value; draw(); if(view==="list") renderList(); });
$("iso").onclick = () => { isolate = !isolate; $("iso").classList.toggle("on", isolate); draw(); };
$("fit").onclick = () => { fitToWidth(); draw(); };
$("relDefault").onclick = () => { activeRels = new Set(DEFAULT_RELS); renderRelChips(); draw(); };
$("relAll").onclick = () => { activeRels = new Set(DATA.relTypes.map(r => r[0])); renderRelChips(); draw(); };
$("map").addEventListener("click", () => { selected = null; draw(); });
document.addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-jump]");
  if (!a) return;
  ev.preventDefault();
  showView("map");
  select(a.dataset.jump);
});

(function enablePanZoom() {
  const svg = $("map");
  let dragging = false, last = null;
  svg.addEventListener("pointerdown", (e) => { dragging = true; last = {x:e.clientX,y:e.clientY}; svg.classList.add("drag"); });
  window.addEventListener("pointerup", () => { dragging=false; svg.classList.remove("drag"); });
  window.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    transform.x += e.clientX - last.x;
    transform.y += e.clientY - last.y;
    last = {x:e.clientX,y:e.clientY};
    draw();
  });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.92;
    transform.k = Math.min(2.4, Math.max(0.25, transform.k * factor));
    draw();
  }, { passive: false });
})();

renderStats();
renderRelChips();
renderLegend();
fitToWidth();
draw();
window.addEventListener("resize", () => { if (view==="map") { fitToWidth(); draw(); } });
</script>
</body>
</html>
