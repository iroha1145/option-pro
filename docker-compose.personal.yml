x-optix-image: &optix-image
  image: "option-pro-personal:${APP_COMMIT:-local}"
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      APP_VERSION: "${APP_VERSION:-dev}"
      APP_COMMIT: "${APP_COMMIT:-unknown}"

x-optix-runtime: &optix-runtime
  <<: *optix-image
  init: true
  env_file:
    - path: ${PERSONAL_MACHINE_FILE:-machine.env}
      required: false
    - path: ${PERSONAL_SECRETS_FILE:-config/migrated/secrets.env}
      required: false
  environment:
    OPENAI_JOB_DB_PATH: "${OPENAI_JOB_DB_PATH:-/data/ai-jobs.db}"
    MACROLENS_CACHE_DB_PATH: "${MACROLENS_CACHE_DB_PATH:-/data/catalyst-cache.db}"
    BREAKOUT_DB_PATH: "${BREAKOUT_DB_PATH:-/data/optix.db}"
    OPTIX_WORKER_DB_PATH: "${OPTIX_WORKER_DB_PATH:-/data/optix-worker.db}"
    OPTIX_WORKER_LOCK_PATH: "${OPTIX_WORKER_LOCK_PATH:-/data/optix-worker.lock}"
    WATCHLIST_SNAPSHOT_PATH: "${WATCHLIST_SNAPSHOT_PATH:-/data/watchlist-snapshot-v1.json}"
    APP_VERSION: "${APP_VERSION:-dev}"
    APP_COMMIT: "${APP_COMMIT:-unknown}"
  volumes:
    - optix-data:/data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  stop_grace_period: 60s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  backend:
    <<: *optix-runtime
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-2000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    <<: *optix-runtime
    stop_grace_period: 2100s
    command:
      - python
      - -m
      - app.worker
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  optix-data:
