name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: backend
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Set up Node.js 22.17.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare build metadata and environment
        shell: bash
        run: |
          cp .env.example .env
          echo "APP_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
          echo "FOCUS_PRODUCER_ENABLED=false" >> "$GITHUB_ENV"

      - name: Verify dependency locks match their source files
        shell: bash
        run: |
          runtime_hash="$(sha256sum backend/requirements.in | awk '{print $1}')"
          ci_hash="$(cat backend/requirements.in backend/requirements-ci.in | sha256sum | awk '{print $1}')"
          grep -qx "# source-sha256: ${runtime_hash}" backend/requirements.txt
          grep -qx "# source-sha256: ${ci_hash}" backend/requirements-ci.txt

      - name: Install locked test and audit dependencies
        run: python -m pip install --require-hashes -r backend/requirements-ci.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit locked runtime dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r backend/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q backend/app

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z 'frontend/**/*.js')

      - name: Run frontend behavior tests
        run: node --test frontend/tests/*.test.mjs

      - name: Run frontend production assertions
        run: node frontend/tests/static_assertions.mjs

      - name: Install locked browser-test dependencies
        shell: bash
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          cd frontend
          npx playwright install --with-deps chromium

      - name: Check shell script syntax
        run: bash -n setup.sh personal.sh scripts/deploy.sh scripts/lock-dependencies.sh

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          else
            git diff --check "${{ github.event.before }}..HEAD"
          fi

      - name: Prepare offline container configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config/personal.toml")
          text = path.read_text(encoding="utf-8")
          if text.count("breakout_enabled = true") != 1:
              raise SystemExit("offline breakout override no longer matches personal.toml")
          if text.count('catalyst_mode = "manual"') != 1:
              raise SystemExit("offline Catalyst override no longer matches personal.toml")
          text = text.replace("breakout_enabled = true", "breakout_enabled = false", 1)
          text = text.replace('catalyst_mode = "manual"', 'catalyst_mode = "off"', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          docker compose config -q
          docker compose -f docker-compose.personal.yml config -q

      - name: Build production image
        shell: bash
        run: |
          docker compose build backend
          docker compose -f docker-compose.personal.yml build worker

      - name: Start and health-check the personal unified worker
        shell: bash
        run: |
          docker compose -f docker-compose.personal.yml up -d --no-build --no-deps worker
          for attempt in {1..60}; do
            if docker compose -f docker-compose.personal.yml exec -T worker \
              python -m app.worker --healthcheck > /tmp/personal-worker-health.json; then
              break
            fi
            sleep 2
          done
          python -c 'import json; p=json.load(open("/tmp/personal-worker-health.json", encoding="utf-8")); assert p["healthy"] is True; assert p["task_inventory_complete"] is True; assert {item["task_name"] for item in p["tasks"]} == {"breakout","focus","catalyst_sync","ai_jobs","maintenance"}'
          docker compose -f docker-compose.personal.yml exec -T worker \
            python -c 'import os; assert os.geteuid() != 0'
          docker compose -f docker-compose.personal.yml run --rm --no-deps \
            --env INTERNAL_API_TOKEN=container-fixture-owner \
            --env MACROLENS_URL=https://macrolens.fixture \
            --env MACROLENS_CACHE_DB_PATH=/data/container-catalyst.db \
            --env OPENAI_JOB_DB_PATH=/data/container-ai-jobs.db \
            --volume "${GITHUB_WORKSPACE}/tests:/ci-tests:ro" \
            worker python /ci-tests/container_personal_catalyst_smoke.py |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "idle"; assert p["processed"] == ["news","calendar","local_intelligence"]; assert p["model"] == "gpt-5.6-terra"; assert p["reasoning"] == "max"; assert p["max_concurrency"] == 1; assert p["authorization_checked"] is True'
          docker compose -f docker-compose.personal.yml down --remove-orphans --volumes

      - name: Start production containers and wait for readiness
        run: docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 180

      - name: Capture Catalyst Desk visual evidence
        env:
          OPTIX_VISUAL_BASE_URL: http://127.0.0.1:2000
        run: npm --prefix frontend run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalyst-desk-visual-evidence-${{ github.sha }}
          path: |
            frontend/test-results/visual-evidence/*.png
            frontend/test-results/report/**
            frontend/test-results/playwright/**
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test version, frontend, APIs, headers, and compression
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 http://127.0.0.1:2000/ready |
            python -c 'import json, os, sys; p=json.load(sys.stdin); assert p["status"] == "ready"; assert p["app_commit"] == os.environ["APP_COMMIT"]; assert p["frontend"]["ready"] is True'
          curl --fail --silent --show-error http://127.0.0.1:2000/health |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "ok"; assert len(p["frontend"]["sha256"]) == 64'
          curl --fail --silent --show-error -D /tmp/optix-root.headers -o /tmp/optix-root.html http://127.0.0.1:2000/
          grep -qi '^content-security-policy:' /tmp/optix-root.headers
          grep -qi '^cache-control:.*no-store' /tmp/optix-root.headers
          grep -q '<title>Optix Pro' /tmp/optix-root.html
          curl --fail --silent --show-error -H 'Accept-Encoding: gzip' -D /tmp/optix-static.headers -o /tmp/optix-styles.gz http://127.0.0.1:2000/static/css/optix-deck.css
          grep -qi '^content-encoding: gzip' /tmp/optix-static.headers
          grep -qi '^cache-control:.*max-age=300' /tmp/optix-static.headers
          curl --fail --silent --show-error http://127.0.0.1:2000/api/breakouts/status |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["enabled"] is False; assert p["range_persistence_mode"] == "shadow"'
          curl --fail --silent --show-error http://127.0.0.1:2000/api/ai/status |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "not_configured"; assert p["model"] == "gpt-5.6-terra"; assert p["reasoning"] == "max"; assert p["execution_mode"] == "background"; assert p["sdk_capability_supported"] is True; assert all(p["methods"].get(x) is True for x in ("create","retrieve","cancel"))'
          curl --fail --silent --show-error http://127.0.0.1:2000/api/catalysts/status |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["enabled"] is False; assert p["schema_version"] == "macrolens-option-pro-v2"; assert p["expected_model"] == "gpt-5.6-terra"; assert p["expected_reasoning"] == "max"'
          curl --fail --silent --show-error http://127.0.0.1:2000/api/breakouts/current |
            python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="disabled"; assert p["events"]==[]'
          docker compose exec -T breakout-worker python -m app.services.breakouts.worker --healthcheck |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] != "disabled"; assert p["healthy"] is True; assert p["enabled"] is True'
          docker compose exec -T ai-worker python -m app.services.ai_jobs.worker --healthcheck |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["healthy"] is True; assert p["configured"] is False; assert p["sdk_capability_supported"] is True; assert p["model"] == "gpt-5.6-terra"; assert p["reasoning"] == "max"; assert all(p["methods"].get(x) is True for x in ("create","retrieve","cancel"))'
          docker compose exec -T catalyst-sync-worker python -m app.services.catalysts.worker --healthcheck |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["healthy"] is True; assert p["enabled"] is False; assert p["schema_version"] == "macrolens-option-pro-v2"; assert p["remote_checked"] is False'
          docker compose exec -T focus-context-producer python -m app.services.catalysts.focus_worker --healthcheck |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["healthy"] is True; assert p["enabled"] is False; assert p["ready_dependency"] is False'
          docker compose run --rm --no-deps catalyst-sync-worker python -m app.services.catalysts.worker --once |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["enabled"] is False; assert p["processed"] == []'
          docker compose run --rm --no-deps breakout-worker python -m app.services.breakouts.worker --once |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "locked"; assert p["scan_run_id"] is None'

      - name: Exercise enabled closed and mocked-active Breakout Radar in the production image
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --env BREAKOUT_RADAR_ENABLED=true \
            --env PYTHONPATH=/app/backend \
            --volume "${GITHUB_WORKSPACE}/tests:/ci-tests:ro" \
            breakout-worker \
            python /ci-tests/container_breakout_runtime_smoke.py \
              /ci-tests/fixtures/breakouts/provider_regular.json |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["closed"]["status"] == "paused"; assert p["closed"]["scan_run_id"] is None; assert p["active"]["status"] == "completed"; assert p["active"]["event_count"] == 0'

      - name: Exercise the enabled focus producer with offline market fixtures
        shell: bash
        run: |
          docker compose run --rm --no-deps \
            --env FOCUS_PRODUCER_ENABLED=true \
            --env PYTHONPATH=/app/backend \
            --volume "${GITHUB_WORKSPACE}/tests:/ci-tests:ro" \
            focus-context-producer \
            python /ci-tests/container_focus_producer_smoke.py |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "completed"; assert p["revision"] == 1; assert p["basis"] == "intraday_completed_bars"; assert p["health"] == "ok"'

      - name: Verify non-root read-only runtime and shared SQLite WAL volume
        shell: bash
        run: |
          docker compose exec -T backend python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T ai-worker python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T catalyst-sync-worker python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T focus-context-producer python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T breakout-worker python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T backend test -r /licenses/THIRD_PARTY_NOTICES.md
          docker compose exec -T breakout-worker test -r /licenses/BreakoutAnalysis-LICENSE
          if docker compose exec -T backend touch /home/app/.rootfs-write-probe; then exit 1; fi
          if docker compose exec -T ai-worker touch /home/app/.rootfs-write-probe; then exit 1; fi
          if docker compose exec -T catalyst-sync-worker touch /home/app/.rootfs-write-probe; then exit 1; fi
          if docker compose exec -T focus-context-producer touch /home/app/.rootfs-write-probe; then exit 1; fi
          if docker compose exec -T breakout-worker touch /home/app/.rootfs-write-probe; then exit 1; fi
          docker compose exec -T breakout-worker python -c 'import sqlite3,time; from pathlib import Path; from app.services.breakouts.repository import BreakoutRepository; p=Path("/data/optix.db"); BreakoutRepository(p).initialize(); c=sqlite3.connect(p); assert c.execute("PRAGMA journal_mode").fetchone()[0].lower()=="wal"; c.execute("CREATE TABLE IF NOT EXISTS deployment_wal_probe(value TEXT NOT NULL)"); c.commit(); c.execute("BEGIN IMMEDIATE"); c.execute("INSERT INTO deployment_wal_probe(value) VALUES (?)",("shared",)); Path("/data/.wal-probe-ready").write_text("ready",encoding="utf-8"); time.sleep(15); c.commit(); c.close()' &
          probe_pid=$!
          for attempt in {1..30}; do
            if docker compose exec -T backend test -f /data/.wal-probe-ready; then break; fi
            sleep 0.5
          done
          docker compose exec -T backend test -f /data/.wal-probe-ready
          docker compose exec -T backend python -c 'import sqlite3; from pathlib import Path; p=Path("/data/optix.db"); assert p.exists(); assert Path(str(p)+"-wal").exists(); assert Path(str(p)+"-shm").exists(); c=sqlite3.connect(f"file:{p}?mode=ro",uri=True); assert c.execute("PRAGMA journal_mode").fetchone()[0].lower()=="wal"; assert c.execute("SELECT COUNT(*) FROM deployment_wal_probe").fetchone()[0]==0; c.close()'
          wait "$probe_pid"
          docker compose exec -T backend python -c 'import sqlite3; from pathlib import Path; p=Path("/data/optix.db"); c=sqlite3.connect(f"file:{p}?mode=ro",uri=True); assert c.execute("SELECT COUNT(*) FROM deployment_wal_probe").fetchone()[0]==1; c.close()'

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --tail=200 backend ai-worker catalyst-sync-worker focus-context-producer breakout-worker

      - name: Clean up containers
        if: always()
        run: docker compose down --remove-orphans --volumes
