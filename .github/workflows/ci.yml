name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Prepare build metadata and environment
        shell: bash
        run: |
          cp .env.example .env
          echo "APP_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Verify dependency locks match their source files
        shell: bash
        run: |
          runtime_hash="$(sha256sum backend/requirements.in | awk '{print $1}')"
          ci_hash="$(cat backend/requirements.in backend/requirements-ci.in | sha256sum | awk '{print $1}')"
          grep -qx "# source-sha256: ${runtime_hash}" backend/requirements.txt
          grep -qx "# source-sha256: ${ci_hash}" backend/requirements-ci.txt

      - name: Install locked test and audit dependencies
        run: python -m pip install --require-hashes -r backend/requirements-ci.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit locked runtime dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r backend/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q backend/app

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z 'frontend/**/*.js')

      - name: Run frontend production assertions
        run: node frontend/tests/static_assertions.mjs

      - name: Check shell script syntax
        run: bash -n setup.sh scripts/deploy.sh scripts/lock-dependencies.sh

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build production image
        run: docker compose build backend

      - name: Start production containers and wait for readiness
        run: docker compose up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 180

      - name: Smoke-test version, frontend, breakout status, headers, and compression
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 http://127.0.0.1:2000/ready |
            python -c 'import json, os, sys; p=json.load(sys.stdin); assert p["status"] == "ready"; assert p["app_commit"] == os.environ["APP_COMMIT"]; assert p["frontend"]["ready"] is True'
          curl --fail --silent --show-error http://127.0.0.1:2000/health |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "ok"; assert len(p["frontend"]["sha256"]) == 64'
          curl --fail --silent --show-error -D /tmp/optix-root.headers -o /tmp/optix-root.html http://127.0.0.1:2000/
          grep -qi '^content-security-policy:' /tmp/optix-root.headers
          grep -qi '^cache-control:.*no-store' /tmp/optix-root.headers
          grep -q '<title>Optix Pro' /tmp/optix-root.html
          curl --fail --silent --show-error -H 'Accept-Encoding: gzip' -D /tmp/optix-static.headers -o /tmp/optix-styles.gz http://127.0.0.1:2000/static/css/optix-core-v3.css
          grep -qi '^content-encoding: gzip' /tmp/optix-static.headers
          grep -qi '^cache-control:.*max-age=300' /tmp/optix-static.headers
          curl --fail --silent --show-error http://127.0.0.1:2000/api/breakouts/status |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["enabled"] is False; assert p["range_persistence_mode"] == "shadow"'
          docker compose exec -T breakout-worker python -m app.services.breakouts.worker --healthcheck |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["healthy"] is True'
          docker compose run --rm --no-deps breakout-worker python -m app.services.breakouts.worker --once |
            python -c 'import json, sys; p=json.load(sys.stdin); assert p["status"] == "disabled"; assert p["scan_run_id"] is None'

      - name: Verify non-root read-only runtime and shared SQLite WAL volume
        shell: bash
        run: |
          docker compose exec -T backend python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T breakout-worker python -c 'import os; assert os.geteuid() != 0'
          docker compose exec -T backend test -r /licenses/THIRD_PARTY_NOTICES.md
          docker compose exec -T breakout-worker test -r /licenses/BreakoutAnalysis-LICENSE
          if docker compose exec -T backend touch /home/app/.rootfs-write-probe; then exit 1; fi
          if docker compose exec -T breakout-worker touch /home/app/.rootfs-write-probe; then exit 1; fi
          docker compose exec -T breakout-worker python -c 'import sqlite3,time; from pathlib import Path; from app.services.breakouts.repository import BreakoutRepository; p=Path("/data/optix.db"); BreakoutRepository(p).initialize(); c=sqlite3.connect(p); assert c.execute("PRAGMA journal_mode").fetchone()[0].lower()=="wal"; c.execute("CREATE TABLE IF NOT EXISTS deployment_wal_probe(value TEXT NOT NULL)"); c.commit(); c.execute("BEGIN IMMEDIATE"); c.execute("INSERT INTO deployment_wal_probe(value) VALUES (?)",("shared",)); Path("/data/.wal-probe-ready").write_text("ready",encoding="utf-8"); time.sleep(15); c.commit(); c.close()' &
          probe_pid=$!
          for attempt in {1..30}; do
            if docker compose exec -T backend test -f /data/.wal-probe-ready; then break; fi
            sleep 0.5
          done
          docker compose exec -T backend test -f /data/.wal-probe-ready
          docker compose exec -T backend python -c 'import sqlite3; from pathlib import Path; p=Path("/data/optix.db"); assert p.exists(); assert Path(str(p)+"-wal").exists(); assert Path(str(p)+"-shm").exists(); c=sqlite3.connect(f"file:{p}?mode=ro",uri=True); assert c.execute("PRAGMA journal_mode").fetchone()[0].lower()=="wal"; assert c.execute("SELECT COUNT(*) FROM deployment_wal_probe").fetchone()[0]==0; c.close()'
          wait "$probe_pid"
          docker compose exec -T backend python -c 'import sqlite3; from pathlib import Path; p=Path("/data/optix.db"); c=sqlite3.connect(f"file:{p}?mode=ro",uri=True); assert c.execute("SELECT COUNT(*) FROM deployment_wal_probe").fetchone()[0]==1; c.close()'

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --tail=200 backend breakout-worker

      - name: Clean up containers
        if: always()
        run: docker compose down --remove-orphans --volumes
