name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_ENV_FILES: ".env,machine.env"
      PYTHONPATH: backend
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Set up Node.js 22.17.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      - name: Prepare build metadata and environment
        shell: bash
        run: |
          cp .env.example .env
          cp machine.env.example machine.env
          echo "APP_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Verify dependency locks match their source files
        shell: bash
        run: |
          runtime_hash="$(sha256sum backend/requirements.in | awk '{print $1}')"
          ci_hash="$(cat backend/requirements.in backend/requirements-ci.in | sha256sum | awk '{print $1}')"
          grep -qx "# source-sha256: ${runtime_hash}" backend/requirements.txt
          grep -qx "# source-sha256: ${ci_hash}" backend/requirements-ci.txt

      - name: Install locked test and audit dependencies
        run: python -m pip install --require-hashes -r backend/requirements-ci.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Audit locked runtime dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r backend/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q backend/app

      - name: Build frontend and verify committed artifacts match source
        shell: bash
        run: |
          npm ci --prefix frontend-src --ignore-scripts --no-audit --no-fund
          VITE_API_MODE=live npm run build --prefix frontend-src
          diff -r frontend-src/dist frontend

      - name: Run frontend behavior tests
        run: node --experimental-strip-types --test frontend-src/tests/*.test.mjs

      - name: Run frontend production assertions
        run: node frontend-src/tests/static_assertions.mjs

      - name: Install locked browser-test dependencies
        shell: bash
        run: |
          cd frontend-src
          npx playwright install --with-deps chromium

      - name: Check shell script syntax
        run: bash -n setup.sh personal.sh scripts/compose.sh scripts/deploy.sh scripts/lock-dependencies.sh

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
          elif git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff --check "${before}..HEAD"
          else
            base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)"
            git diff --check "${base}..HEAD"
          fi

      - name: Prepare offline container configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config/personal.toml")
          text = path.read_text(encoding="utf-8")
          if text.count("breakout_enabled = true") != 1:
              raise SystemExit("offline breakout override no longer matches personal.toml")
          if text.count('catalyst_mode = "scheduled"') != 1:
              raise SystemExit("offline Catalyst override no longer matches personal.toml")
          text = text.replace("breakout_enabled = true", "breakout_enabled = false", 1)
          text = text.replace('catalyst_mode = "scheduled"', 'catalyst_mode = "off"', 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate formal Docker Compose configuration
        shell: bash
        run: |
          ./scripts/compose.sh config -q
          test "$(./scripts/compose.sh config --services | sort | tr '\n' ' ')" = "backend worker "
          ./scripts/compose.sh config --format json |
            python -c 'import json,sys; p=json.load(sys.stdin); s=p["services"]; assert set(s)=={"backend","worker"}; assert s["backend"]["image"]==s["worker"]["image"]; assert all(x.get("read_only") is True for x in s.values()); assert all(any(v.get("target")=="/data" for v in x.get("volumes",[])) for x in s.values()); assert set(p.get("volumes",{}))=={"optix-data"}'

      - name: Build production image
        run: ./scripts/compose.sh build backend

      - name: Validate deployment boundary in production image
        run: >-
          ./scripts/compose.sh run --rm --no-deps -T backend
          python -m app.tools.validate_personal_deployment

      - name: Exercise container-backed Personal CLI
        shell: bash
        run: |
          ./personal.sh doctor
          test_value="ci-personal-cli-token-not-a-secret"
          printf '%s\n' "$test_value" |
            ./personal.sh secrets set MARKETDATA_TOKEN >/tmp/personal-set.json
          report="$(./personal.sh secrets status)"
          case "$report" in *"$test_value"*) exit 1 ;; esac
          REPORT="$report" python - <<'PY'
          import json
          import os

          report = json.loads(os.environ["REPORT"])
          assert report["MARKETDATA_TOKEN"] == {"configured": True}
          PY
          test "$(stat -c '%a' secrets.env)" = "600"
          ./personal.sh secrets remove MARKETDATA_TOKEN >/tmp/personal-remove.json
          rm -f secrets.env secrets.env.bak.* .secrets.env.lock

      - name: Start backend and unified worker
        run: ./scripts/compose.sh up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 180

      # 顺序刻意如此：确定性检查（就绪/Inventory、三个离线容器 smoke、
      # 非 root 与 WAL 校验）全部排在浏览器取证之前。视觉步骤跑在 bash -e 下，
      # 一次浏览器失败会中止整个 job；若它排在前面，上面这些检查会被 skipped，
      # 等于被一个前端失败遮住。
      - name: Check local readiness and unified worker inventory
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 http://127.0.0.1:2000/ready |
            python -c 'import json,os,sys; p=json.load(sys.stdin); assert p["status"]=="ready"; assert p["app_commit"]==os.environ["APP_COMMIT"]; assert p["frontend"]["ready"] is True'
          curl --fail --silent --show-error http://127.0.0.1:2000/health |
            python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="ok"; assert len(p["frontend"]["sha256"])==64'
          curl --fail --silent --show-error -D /tmp/optix-root.headers -o /tmp/optix-root.html http://127.0.0.1:2000/
          grep -qi '^content-security-policy:' /tmp/optix-root.headers
          grep -qi '^cache-control:.*no-store' /tmp/optix-root.headers
          grep -q '<title>Optix Pro' /tmp/optix-root.html
          css_ref=$(grep -o '\./assets/index-[^"]*\.css' /tmp/optix-root.html | head -n 1)
          test -n "$css_ref"
          curl --fail --silent --show-error -H 'Accept-Encoding: gzip' -D /tmp/optix-static.headers -o /tmp/optix-styles.gz "http://127.0.0.1:2000${css_ref#.}"
          grep -qi '^content-encoding: gzip' /tmp/optix-static.headers
          # 带内容哈希的 /assets/ 产物走一年 immutable 缓存（app/main.py 静态头策略）
          grep -qi '^cache-control:.*max-age=31536000.*immutable' /tmp/optix-static.headers
          worker_ready=false
          for attempt in {1..30}; do
            if ./scripts/compose.sh exec -T worker python -m app.worker --healthcheck |
              python -c 'import json,sys; p=json.load(sys.stdin); expected={"breakout","catalyst_sync","focus","ai_jobs","maintenance","stock_directory","public_home","earnings_analysis","macro_conditions","focus_refresh","strength_refresh","breakout_refresh","retention"}; actual={x.get("task_name") for x in p.get("tasks",[])}; assert p.get("healthy") is True; assert p.get("schema_version")=="optix-worker-v2"; assert actual==expected'; then
              worker_ready=true
              break
            fi
            sleep 1
          done
          test "$worker_ready" = true

      - name: Exercise Breakout Radar with offline fixtures
        shell: bash
        run: |
          ./scripts/compose.sh run --rm --no-deps \
            --env PYTHONPATH=/app/backend \
            --volume "${GITHUB_WORKSPACE}/tests:/ci-tests:ro" \
            worker \
            python /ci-tests/container_breakout_runtime_smoke.py \
              /ci-tests/fixtures/breakouts/provider_regular.json |
            python -c 'import json,sys; p=json.load(sys.stdin); assert p["closed"]["status"]=="paused"; assert p["closed"]["scan_run_id"] is None; assert p["active"]["status"]=="completed"; assert p["active"]["event_count"]==0'

      - name: Exercise Catalyst ETL with offline fixtures
        shell: bash
        run: |
          ./scripts/compose.sh run --rm --no-deps \
            --env INTERNAL_API_TOKEN=container-fixture-owner \
            --env MACROLENS_URL=https://macrolens.fixture \
            --env DATA_DIR=/data/container-catalyst-fixture \
            --env PYTHONPATH=/app/backend \
            --volume "${GITHUB_WORKSPACE}/tests:/ci-tests:ro" \
            worker python /ci-tests/container_personal_catalyst_smoke.py |
            python -c 'import json,sys; p=json.load(sys.stdin); assert p["status"]=="idle"; assert p["processed"]==["news","calendar","local_intelligence"]; assert p["model"]=="gpt-5.6-terra"; assert p["reasoning"]=="max"; assert p["max_concurrency"]==1; assert p["authorization_checked"] is True'

      - name: Exercise Optix macro conditions with offline fixtures
        shell: bash
        run: |
          # Fake FRED transport + synthetic ETF fixture. No real network, no real
          # FRED key, no provider call: the whole refresh runs inside the image.
          ./scripts/compose.sh run --rm --no-deps \
            --env DATA_DIR=/data/container-macro-fixture \
            --env PYTHONPATH=/app/backend \
            --volume "${GITHUB_WORKSPACE}/tests:/ci-tests:ro" \
            worker python /ci-tests/container_macro_conditions_smoke.py |
            python -c '
          import json, sys
          p = json.load(sys.stdin)
          assert p["task_status"] == "idle", p
          assert p["published"] is True, p
          assert p["series_succeeded"] == 24, p
          assert p["series_failed"] == 0, p
          assert p["journal_mode"] == "wal", p
          assert p["integrity_check"] == "ok", p
          assert p["foreign_key_violations"] == 0, p
          assert p["schema_version"] == "macro-conditions-v1", p
          assert p["registered_factors"] == 30, p
          assert p["factor_rows"] == 30, p
          assert p["module_rows"] == 7, p
          assert p["total_modules"] == 7, p
          assert p["scoring_version"] == "optix-macro-score-v1", p
          assert p["composite_score_present"] is True, p
          assert p["valid_module_count"] == 7, p
          assert p["regime_present"] is True, p
          assert p["history_basis"] == "latest_revised_backfill", p
          assert p["api_status"] == "active", p
          assert p["api_module_count"] == 7, p
          assert p["ai_block_modules"] == 7, p
          assert p["ai_block_bytes"] <= 4096, p
          '

      - name: Verify non-root read-only runtime and shared SQLite WAL volume
        shell: bash
        run: |
          ./scripts/compose.sh exec -T backend python -c 'import os; assert os.geteuid()!=0'
          ./scripts/compose.sh exec -T worker python -c 'import os; assert os.geteuid()!=0'
          ./scripts/compose.sh exec -T backend test -r /licenses/THIRD_PARTY_NOTICES.md
          ./scripts/compose.sh exec -T worker test -r /licenses/BreakoutAnalysis-LICENSE
          if ./scripts/compose.sh exec -T backend touch /home/app/.rootfs-write-probe; then exit 1; fi
          if ./scripts/compose.sh exec -T worker touch /home/app/.rootfs-write-probe; then exit 1; fi
          ./scripts/compose.sh exec -T worker python -c 'import sqlite3,time; from pathlib import Path; from app.services.breakouts.repository import BreakoutRepository; p=Path("/data/optix.db"); BreakoutRepository(p).initialize(); c=sqlite3.connect(p); assert c.execute("PRAGMA journal_mode").fetchone()[0].lower()=="wal"; c.execute("CREATE TABLE IF NOT EXISTS deployment_wal_probe(value TEXT NOT NULL)"); c.commit(); c.execute("BEGIN IMMEDIATE"); c.execute("INSERT INTO deployment_wal_probe(value) VALUES (?)",("shared",)); Path("/data/.wal-probe-ready").write_text("ready",encoding="utf-8"); time.sleep(15); c.commit(); c.close()' &
          probe_pid=$!
          for attempt in {1..30}; do
            if ./scripts/compose.sh exec -T backend test -f /data/.wal-probe-ready; then break; fi
            sleep 0.5
          done
          ./scripts/compose.sh exec -T backend test -f /data/.wal-probe-ready
          ./scripts/compose.sh exec -T backend python -c 'import sqlite3; from pathlib import Path; p=Path("/data/optix.db"); assert p.exists(); assert Path(str(p)+"-wal").exists(); assert Path(str(p)+"-shm").exists(); c=sqlite3.connect(f"file:{p}?mode=ro",uri=True); assert c.execute("PRAGMA journal_mode").fetchone()[0].lower()=="wal"; assert c.execute("SELECT COUNT(*) FROM deployment_wal_probe").fetchone()[0]==0; c.close()'
          wait "$probe_pid"
          ./scripts/compose.sh exec -T backend python -c 'import sqlite3; from pathlib import Path; p=Path("/data/optix.db"); c=sqlite3.connect(f"file:{p}?mode=ro",uri=True); assert c.execute("SELECT COUNT(*) FROM deployment_wal_probe").fetchone()[0]==1; c.close()'

      - name: Capture Catalyst Desk and macro conditions visual evidence
        env:
          OPTIX_VISUAL_BASE_URL: http://127.0.0.1:2000
        run: npm --prefix frontend-src run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalyst-desk-visual-evidence-${{ github.sha }}
          path: |
            frontend-src/test-results/visual-evidence/*.png
            frontend-src/test-results/report/**
            frontend-src/test-results/playwright/**
          if-no-files-found: error
          retention-days: 14

      - name: Show container logs after failure
        if: failure()
        run: ./scripts/compose.sh logs --tail=200 backend worker

      - name: Clean up containers
        if: always()
        run: ./scripts/compose.sh down --remove-orphans --volumes
