name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest==8.3.4

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q backend/app

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z 'frontend/**/*.js')

      - name: Check setup script syntax
        run: bash -n setup.sh

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q
