name: PR148 isolated review source
on:
  push:
    branches: [codex/pr148-final-review-20260908]
    paths: [.github/workflows/pr148-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/codex/pr148-final-review-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download test-only offline wheels
        run: |
          python -m pip download --only-binary=:all: -d wheelhouse yfinance==1.5.1 curl-cffi==0.15.0 openai==2.45.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr148-isolated-review-wheels
          path: wheelhouse/
          retention-days: 1
          if-no-files-found: error
