name: PR148 isolated finishing verification
on:
  push:
    branches: [codex/pr148-final-review-20260908]
    paths: [.github/workflows/pr148-review-source.yml]
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/codex/pr148-final-review-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Validate and apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c5be0860c8a48a35052aea3c2270d8c776304957 HEAD
          test "$(git hash-object backend/app/api/strength.py)" = 560c212e0c6b59087458f8a7b7696cbd6242f34e
          test "$(git hash-object backend/app/services/strength/freshness.py)" = edf2ccce497f2a3683826d101de06575d0e04fe0
          test "$(git hash-object backend/app/worker/tasks.py)" = 82d777f1f0f8092918e6ccc219cea550338b0515
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.review/pr148-final.patch.gz.b64').read_text().strip()
          # Normalize two known text-transport duplications; the digest below
          # remains the authority and rejects any other changed byte.
          encoded = encoded.replace('LnSpSpqh', 'LnSpqh').replace('SpSpWd', 'SpWd')
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'eec5e1f8d5f39c85d90f98758594192f48e28ec4077bfa3d62a683a94f622bb2'
          Path('/tmp/pr148-final.patch').write_bytes(raw)
          PY
          git apply --check /tmp/pr148-final.patch
          git apply --index /tmp/pr148-final.patch
          git rm .review/pr148-final.patch.gz.b64 .github/workflows/pr148-review-source.yml
          git diff --cached --check
          python - <<'PY'
          import subprocess
          allowed = {
            'backend/app/api/strength.py',
            'backend/app/services/strength/freshness.py',
            'backend/app/worker/tasks.py',
            'tests/test_strength_final_review.py',
            'docs/screener-freshness/PR148_FINAL_REVIEW.md',
            '.review/pr148-final.patch.gz.b64',
            '.github/workflows/pr148-review-source.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == allowed, actual
          PY
      - name: Install locked dependencies and run production regressions
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          cp machine.env.example machine.env
          python -m pip install --require-hashes -r backend/requirements-ci.txt
          PYTHONPATH=backend python - <<'PY' | tee /tmp/pr148-final-focused.log
          import glob, subprocess, sys
          paths = sorted(set(glob.glob('tests/test_strength*.py') + glob.glob('tests/test_screener*.py') + glob.glob('tests/*worker*.py')))
          subprocess.run([sys.executable, '-m', 'pytest', '-q', *paths], check=True)
          PY
          python -m compileall -q backend/app
      - name: Commit only checked changes, never force push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/codex/pr148-final-review-20260908
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'PR148 review'
          git config user.email '200401936+iroha1145@users.noreply.github.com'
          git commit -m 'fix(screener): preserve input coverage and exact variant retry deadlines'
          git push origin HEAD:refs/heads/codex/pr148-final-review-20260908
          git rev-parse HEAD | tee /tmp/pr148-final-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr148-finishing-regression-evidence
          path: |
            /tmp/pr148-final-focused.log
            /tmp/pr148-final-commit.txt
            /tmp/pr148-final.patch
          retention-days: 7
          if-no-files-found: warn
