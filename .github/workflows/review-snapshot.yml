name: Review source snapshot
on:
  push:
    branches: [fix/realtime-quotes-review-20260906]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/realtime-quotes-review-20260906
          fetch-depth: 2
      - name: Verify reviewed patch before applying
        run: |
          cp .review/source.patch.gz.b64 /tmp/transferred-patch.b64
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text = Path('.review/source.patch.gz.b64').read_text()
          text = text.replace('qx14UUBAFr', 'qx14UZAFr').replace('ijfpEzVUzBuz', 'ijfpEzVqwBuz')
          patch = gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest() == '9846caee9afaee5425876ca2a83e05780729c74844bd6cb16d88f779eefc64ae'
          Path('/tmp/review.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.17.1"
      - name: Build reviewed frontend
        run: |
          npm ci --prefix frontend-src --ignore-scripts --no-audit --no-fund
          VITE_API_MODE=live npm run build --prefix frontend-src
          rsync -a --delete frontend-src/dist/ frontend/
          node --experimental-strip-types --test frontend-src/tests/*.test.mjs > /tmp/review-frontend-tests.log
          npm --prefix frontend-src run lint
      - name: Commit reviewed source and synchronized assets on the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/review-snapshot.yml .review/source.patch.gz.b64
          git add backend frontend-src/src frontend-src/tests frontend-src/visual-tests frontend tests
          git diff --cached --check -- . ':(top,exclude)frontend'
          git commit -m 'fix: preserve realtime evidence, reject stale radar candidates, and recover quote UI safely'
          git push origin HEAD:fix/realtime-quotes-review-20260906
          git archive --format=tar.gz -o /tmp/review-fixed-source.tar.gz HEAD
      - name: Install browser
        run: cd frontend-src && npx playwright install --with-deps chromium
      - name: Exercise live quotes and responsive layouts
        run: npm --prefix frontend-src run test:quotes 2>&1 | tee /tmp/review-browser-quotes.log
      - name: Exercise existing UI and keyboard regression suite
        if: success() || failure()
        run: npm --prefix frontend-src run test:review 2>&1 | tee /tmp/review-browser-layout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-pro-review-validation
          path: |
            /tmp/transferred-patch.b64
            /tmp/review*.log
            /tmp/review-fixed-source.tar.gz
            frontend-src/test-results/
          retention-days: 2
