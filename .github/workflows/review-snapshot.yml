name: Review source snapshot
on:
  push:
    branches: [fix/realtime-quotes-review-20260906]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Export missing local review dependencies
        run: |
          python -m pip install --no-deps --target /tmp/review-python-extra peewee multitasking distro jiter sniffio
          tar -czf /tmp/option-pro-review-python-extra.tar.gz -C /tmp review-python-extra
      - uses: actions/upload-artifact@v4
        with:
          name: option-pro-review-python-extra
          path: /tmp/option-pro-review-python-extra.tar.gz
          retention-days: 1
