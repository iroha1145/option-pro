name: Verify settled indicator evidence
on:
  push:
    branches: [fix/indicator-panes-only-20260906]
    paths: [.github/workflows/indicator-evidence.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/indicator-panes-only-20260906
      - name: Preserve chart animations and wait for settled capture
        run: |
          git apply --check .review/indicator-settle.patch
          git apply .review/indicator-settle.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .review/indicator-settle.patch .github/workflows/indicator-evidence.yml
          git add frontend-src/visual-tests/indicator-panes.spec.mjs
          git diff --cached --check
          git commit -m 'test(chart): verify settled pane geometry after original animations'
          git push origin HEAD:fix/indicator-panes-only-20260906
          git archive --format=tar.gz -o /tmp/indicator-final-source.tar.gz HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.17.1"
      - name: Verify unchanged production build and frontend checks
        run: |
          npm ci --prefix frontend-src --ignore-scripts --no-audit --no-fund
          VITE_API_MODE=live npm run build --prefix frontend-src
          diff -r frontend-src/dist frontend
          node --experimental-strip-types --test frontend-src/tests/*.test.mjs > /tmp/indicator-final-units.log
          npm --prefix frontend-src run lint
          node frontend-src/tests/static_assertions.mjs
      - name: Install browser
        run: cd frontend-src && npx playwright install --with-deps chromium
      - name: Verify settled indicator geometry and live integration
        run: |
          npm --prefix frontend-src run test:indicators 2>&1 | tee /tmp/indicator-final-browser.log
          npm --prefix frontend-src run test:quotes 2>&1 | tee /tmp/indicator-final-quotes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indicator-settled-evidence
          path: |
            /tmp/indicator-final-*
            frontend-src/test-results/indicators/
          retention-days: 2
