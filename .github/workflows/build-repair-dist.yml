name: Build repair frontend dist

on:
  push:
    branches:
      - agent/repair-live-data-ai-mobile

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_MODE: live
      - uses: actions/upload-artifact@v4
        with:
          name: repair-frontend-dist
          path: frontend-src/dist
          if-no-files-found: error
          retention-days: 1
