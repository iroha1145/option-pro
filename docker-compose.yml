      - FOCUS_CONTEXT_REFRESH_SECONDS=${FOCUS_CONTEXT_REFRESH_SECONDS:-1800}
      - FOCUS_PRODUCER_SNAPSHOT_GRACE_SECONDS=${FOCUS_PRODUCER_SNAPSHOT_GRACE_SECONDS:-120}
      - FOCUS_PRIORITY_WATCHLIST=${FOCUS_PRIORITY_WATCHLIST:-}
      - FOCUS_MAJOR_INDEX_CONSTITUENTS=${FOCUS_MAJOR_INDEX_CONSTITUENTS:-}
      - FOCUS_MAJOR_MARKET_SYMBOLS=${FOCUS_MAJOR_MARKET_SYMBOLS:-SPY,QQQ,DIA,IWM}
