services:
  backend:
    init: true
    image: "option-pro:${APP_COMMIT:-local}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_COMMIT: "${APP_COMMIT:-unknown}"
    env_file:
      - path: .env
        required: false
      - path: machine.env
        required: false
      - path: secrets.env
        required: false
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ALLOW_CUSTOM_OPENAI_BASE_URL=${ALLOW_CUSTOM_OPENAI_BASE_URL:-false}
      - OPENAI_CUSTOM_CAPABILITIES_CONFIRMED=${OPENAI_CUSTOM_CAPABILITIES_CONFIRMED:-false}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-terra}
      - OPENAI_REASONING=${OPENAI_REASONING:-max}
      - OPENAI_EXECUTION_MODE=${OPENAI_EXECUTION_MODE:-background}
      - OPENAI_REQUIRE_ZDR=${OPENAI_REQUIRE_ZDR:-false}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-900}
      - OPENAI_CONTROL_TIMEOUT_SECONDS=${OPENAI_CONTROL_TIMEOUT_SECONDS:-30}
      - OPENAI_BACKGROUND_POLL_TIMEOUT_SECONDS=${OPENAI_BACKGROUND_POLL_TIMEOUT_SECONDS:-1800}
      - OPENAI_BACKGROUND_INITIAL_POLL_SECONDS=${OPENAI_BACKGROUND_INITIAL_POLL_SECONDS:-2}
      - OPENAI_BACKGROUND_MAX_POLL_SECONDS=${OPENAI_BACKGROUND_MAX_POLL_SECONDS:-15}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-0}
      - OPTION_PRO_AI_MAX_OUTPUT_TOKENS=${OPTION_PRO_AI_MAX_OUTPUT_TOKENS:-${OPENAI_MAX_OUTPUT_TOKENS:-32768}}
      - OPENAI_MAX_CONCURRENCY=${OPENAI_MAX_CONCURRENCY:-1}
      - OPENAI_JOB_DB_PATH=${OPENAI_JOB_DB_PATH:-/data/ai-jobs.db}
      - OPENAI_JOB_LEASE_SECONDS=${OPENAI_JOB_LEASE_SECONDS:-60}
      - OPENAI_JOB_MAX_AGE_SECONDS=${OPENAI_JOB_MAX_AGE_SECONDS:-86400}
      - OPENAI_JOB_MAX_QUEUED=${OPENAI_JOB_MAX_QUEUED:-200}
      - CATALYST_MODE=${CATALYST_MODE:-display}
      - MACROLENS_ENABLED=${MACROLENS_ENABLED:-false}
      - MACROLENS_BASE_URL=${MACROLENS_BASE_URL:-}
      - MACROLENS_VERIFY_TLS=${MACROLENS_VERIFY_TLS:-true}
      - MACROLENS_CA_BUNDLE=${MACROLENS_CA_BUNDLE:-}
      - MACROLENS_ALLOW_LOCAL_HTTP=${MACROLENS_ALLOW_LOCAL_HTTP:-false}
      - MACROLENS_READ_KEY_ID=${MACROLENS_READ_KEY_ID:-}
      - MACROLENS_READ_SECRET=${MACROLENS_READ_SECRET:-}
      - MACROLENS_ACTION_KEY_ID=${MACROLENS_ACTION_KEY_ID:-}
      - MACROLENS_ACTION_SECRET=${MACROLENS_ACTION_SECRET:-}
      - MACROLENS_STALE_TTL_SECONDS=${MACROLENS_STALE_TTL_SECONDS:-86400}
      - MACROLENS_CACHE_DB_PATH=${MACROLENS_CACHE_DB_PATH:-/data/catalyst-cache.db}
      - MACROLENS_FEED_INTERVAL_SECONDS=${MACROLENS_FEED_INTERVAL_SECONDS:-120}
      - MACROLENS_SCHEMA_VERSION=${MACROLENS_SCHEMA_VERSION:-macrolens-option-pro-v2}
      - MACROLENS_SCHEMA_SHA256=${MACROLENS_SCHEMA_SHA256:-29d65fc52d1d9c4a8cb3c665cb0dbaf2cf6ee6d3d91f2e16b16b0a480a65209b}
