      - MACROLENS_FOCUS_CLOCK_SKEW_SECONDS=${MACROLENS_FOCUS_CLOCK_SKEW_SECONDS:-300}
      - MACROLENS_FOCUS_NONCE_TTL_SECONDS=${MACROLENS_FOCUS_NONCE_TTL_SECONDS:-600}
      - FOCUS_DOLLAR_VOLUME_COUNT=${FOCUS_DOLLAR_VOLUME_COUNT:-20}
      - FOCUS_STRENGTH_COUNT=${FOCUS_STRENGTH_COUNT:-10}
      - FOCUS_MAX_SYMBOLS=${FOCUS_MAX_SYMBOLS:-40}
