services:
  backend:
    init: true
    image: "option-pro:${APP_COMMIT:-local}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_COMMIT: "${APP_COMMIT:-unknown}"
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ALLOW_CUSTOM_OPENAI_BASE_URL=${ALLOW_CUSTOM_OPENAI_BASE_URL:-false}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      - OPENAI_REASONING=${OPENAI_REASONING:-low}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-45}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-0}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      - OPENAI_MAX_CONCURRENCY=${OPENAI_MAX_CONCURRENCY:-2}
      - APP_AUTH_TOKEN=${APP_AUTH_TOKEN:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - HOST_BIND=${HOST_BIND:-127.0.0.1}
      - ALLOW_INSECURE_PUBLIC_BIND=${ALLOW_INSECURE_PUBLIC_BIND:-false}
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_COMMIT=${APP_COMMIT:-unknown}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-2000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
