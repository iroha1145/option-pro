      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - HOST_BIND=${HOST_BIND:-127.0.0.1}
      - ALLOW_INSECURE_PUBLIC_BIND=${ALLOW_INSECURE_PUBLIC_BIND:-false}
      - BREAKOUT_DB_PATH=${BREAKOUT_DB_PATH:-/data/optix.db}
      - BREAKOUT_RADAR_ENABLED=${BREAKOUT_RADAR_ENABLED:-}
      - MARKET_SHAPE_ENTER_CONFIRM_DAYS=${MARKET_SHAPE_ENTER_CONFIRM_DAYS:-2}
      - MARKET_SHAPE_EXIT_CONFIRM_DAYS=${MARKET_SHAPE_EXIT_CONFIRM_DAYS:-2}
      - MARKET_SHAPE_MIN_DWELL_DAYS=${MARKET_SHAPE_MIN_DWELL_DAYS:-3}
      - MARKET_SHAPE_HISTORY_DAYS=${MARKET_SHAPE_HISTORY_DAYS:-20}
      - RANGE_PERSISTENCE_MODE=${RANGE_PERSISTENCE_MODE:-shadow}
      - RANGE_PERSISTENCE_VERSION=${RANGE_PERSISTENCE_VERSION:-range-persistence-v1}
      - RANGE_PERSISTENCE_VALIDATION_VERSION=${RANGE_PERSISTENCE_VALIDATION_VERSION:-}
      - RANGE_PERSISTENCE_LENGTH=${RANGE_PERSISTENCE_LENGTH:-35}
      - RANGE_PERSISTENCE_FAST_LENGTH=${RANGE_PERSISTENCE_FAST_LENGTH:-3}
      - RANGE_PERSISTENCE_SLOPE_DAYS=${RANGE_PERSISTENCE_SLOPE_DAYS:-5}
      - RANGE_PERSISTENCE_RATIO_WINDOW=${RANGE_PERSISTENCE_RATIO_WINDOW:-10}
      - RANGE_PERSISTENCE_RATIO_THRESHOLD=${RANGE_PERSISTENCE_RATIO_THRESHOLD:-60}
      - RANGE_PERSISTENCE_MIN_HISTORY_MULTIPLIER=${RANGE_PERSISTENCE_MIN_HISTORY_MULTIPLIER:-5}
      - RANGE_PERSISTENCE_TREND_FAMILY_WEIGHT=${RANGE_PERSISTENCE_TREND_FAMILY_WEIGHT:-0.15}
      - RANGE_PERSISTENCE_FINAL_WEIGHT_CAP=${RANGE_PERSISTENCE_FINAL_WEIGHT_CAP:-0.04}
      - RANGE_PERSISTENCE_BREAKOUT_INTERACTION_ENABLED=${RANGE_PERSISTENCE_BREAKOUT_INTERACTION_ENABLED:-false}
      - RANGE_PERSISTENCE_BREAKOUT_INTERACTION_CAP=${RANGE_PERSISTENCE_BREAKOUT_INTERACTION_CAP:-4.0}
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_COMMIT=${APP_COMMIT:-unknown}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-2000}:8000"
    volumes:
      - optix-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

