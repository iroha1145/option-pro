services:
  backend:
    init: true
    image: "option-pro:${APP_COMMIT:-local}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-dev}"
        APP_COMMIT: "${APP_COMMIT:-unknown}"
    env_file:
      - path: .env
        required: false
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ALLOW_CUSTOM_OPENAI_BASE_URL=${ALLOW_CUSTOM_OPENAI_BASE_URL:-false}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      - OPENAI_REASONING=${OPENAI_REASONING:-low}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-45}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-0}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-1200}
      - OPENAI_MAX_CONCURRENCY=${OPENAI_MAX_CONCURRENCY:-2}
      - APP_AUTH_TOKEN=${APP_AUTH_TOKEN:-}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - HOST_BIND=${HOST_BIND:-127.0.0.1}
      - ALLOW_INSECURE_PUBLIC_BIND=${ALLOW_INSECURE_PUBLIC_BIND:-false}
      - BREAKOUT_RADAR_ENABLED=${BREAKOUT_RADAR_ENABLED:-false}
      - BREAKOUT_DB_PATH=${BREAKOUT_DB_PATH:-/data/optix.db}
      - RANGE_PERSISTENCE_MODE=${RANGE_PERSISTENCE_MODE:-shadow}
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_COMMIT=${APP_COMMIT:-unknown}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-2000}:8000"
    volumes:
      - optix-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  breakout-worker:
    init: true
    image: "option-pro:${APP_COMMIT:-local}"
    environment:
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_COMMIT=${APP_COMMIT:-unknown}
      - BREAKOUT_RADAR_ENABLED=${BREAKOUT_RADAR_ENABLED:-false}
      - BREAKOUT_DISCOVERY_PROVIDER=${BREAKOUT_DISCOVERY_PROVIDER:-tradingview}
      - BREAKOUT_DB_PATH=${BREAKOUT_DB_PATH:-/data/optix.db}
      - BREAKOUT_PROVIDER_TIMEOUT_SECONDS=${BREAKOUT_PROVIDER_TIMEOUT_SECONDS:-10}
      - BREAKOUT_PROVIDER_CONNECT_TIMEOUT_SECONDS=${BREAKOUT_PROVIDER_CONNECT_TIMEOUT_SECONDS:-2}
      - BREAKOUT_PROVIDER_READ_TIMEOUT_SECONDS=${BREAKOUT_PROVIDER_READ_TIMEOUT_SECONDS:-4}
      - BREAKOUT_PROVIDER_RETRY_ATTEMPTS=${BREAKOUT_PROVIDER_RETRY_ATTEMPTS:-2}
      - BREAKOUT_PROVIDER_RETRY_AFTER_CAP_SECONDS=${BREAKOUT_PROVIDER_RETRY_AFTER_CAP_SECONDS:-2}
      - BREAKOUT_PROVIDER_CACHE_TTL_SECONDS=${BREAKOUT_PROVIDER_CACHE_TTL_SECONDS:-60}
      - BREAKOUT_PROVIDER_STALE_TTL_SECONDS=${BREAKOUT_PROVIDER_STALE_TTL_SECONDS:-900}
      - BREAKOUT_PROVIDER_FAILURE_THRESHOLD=${BREAKOUT_PROVIDER_FAILURE_THRESHOLD:-3}
      - BREAKOUT_PROVIDER_CIRCUIT_OPEN_SECONDS=${BREAKOUT_PROVIDER_CIRCUIT_OPEN_SECONDS:-300}
      - BREAKOUT_PROVIDER_MAX_RESPONSE_BYTES=${BREAKOUT_PROVIDER_MAX_RESPONSE_BYTES:-2000000}
      - BREAKOUT_PROVIDER_RESULT_LIMIT=${BREAKOUT_PROVIDER_RESULT_LIMIT:-150}
      - BREAKOUT_PROVIDER_MIN_MARKET_CAP=${BREAKOUT_PROVIDER_MIN_MARKET_CAP:-200000000}
      - BREAKOUT_PROVIDER_SCHEMA_VERSION=${BREAKOUT_PROVIDER_SCHEMA_VERSION:-tradingview-discovery-v1}
      - BREAKOUT_ALLOW_ETF=${BREAKOUT_ALLOW_ETF:-true}
      - BREAKOUT_DAILY_ENRICH_LIMIT=${BREAKOUT_DAILY_ENRICH_LIMIT:-60}
      - BREAKOUT_INTRADAY_ENRICH_LIMIT=${BREAKOUT_INTRADAY_ENRICH_LIMIT:-30}
      - BREAKOUT_SCAN_INTERVAL_PREMARKET_SECONDS=${BREAKOUT_SCAN_INTERVAL_PREMARKET_SECONDS:-600}
      - BREAKOUT_SCAN_INTERVAL_REGULAR_SECONDS=${BREAKOUT_SCAN_INTERVAL_REGULAR_SECONDS:-300}
      - BREAKOUT_SCAN_INTERVAL_CLOSED_SECONDS=${BREAKOUT_SCAN_INTERVAL_CLOSED_SECONDS:-1800}
      - BREAKOUT_WORKER_LEASE_TTL_SECONDS=${BREAKOUT_WORKER_LEASE_TTL_SECONDS:-90}
      - BREAKOUT_WORKER_HEALTH_STALE_SECONDS=${BREAKOUT_WORKER_HEALTH_STALE_SECONDS:-120}
      - BREAKOUT_RAW_PAYLOAD_RETENTION_HOURS=${BREAKOUT_RAW_PAYLOAD_RETENTION_HOURS:-24}
      - BREAKOUT_SCAN_RETENTION_DAYS=${BREAKOUT_SCAN_RETENTION_DAYS:-30}
      - BREAKOUT_RETENTION_BATCH_SIZE=${BREAKOUT_RETENTION_BATCH_SIZE:-500}
      - BREAKOUT_MIN_PRICE=${BREAKOUT_MIN_PRICE:-2.0}
      - BREAKOUT_MIN_AVG_DOLLAR_VOLUME=${BREAKOUT_MIN_AVG_DOLLAR_VOLUME:-10000000}
      - BREAKOUT_REGULAR_MIN_CHANGE_PCT=${BREAKOUT_REGULAR_MIN_CHANGE_PCT:-3.0}
      - BREAKOUT_REGULAR_MIN_RELATIVE_VOLUME=${BREAKOUT_REGULAR_MIN_RELATIVE_VOLUME:-1.5}
      - BREAKOUT_REGULAR_MIN_DOLLAR_VOLUME=${BREAKOUT_REGULAR_MIN_DOLLAR_VOLUME:-5000000}
      - BREAKOUT_PREMARKET_MIN_CHANGE_PCT=${BREAKOUT_PREMARKET_MIN_CHANGE_PCT:-5.0}
      - BREAKOUT_PREMARKET_MIN_DOLLAR_VOLUME=${BREAKOUT_PREMARKET_MIN_DOLLAR_VOLUME:-500000}
      - BREAKOUT_BASE_MIN_DAYS=${BREAKOUT_BASE_MIN_DAYS:-10}
      - BREAKOUT_BASE_MAX_DAYS=${BREAKOUT_BASE_MAX_DAYS:-80}
      - BREAKOUT_PIVOT_TOLERANCE_ATR=${BREAKOUT_PIVOT_TOLERANCE_ATR:-0.50}
      - BREAKOUT_BREAK_BUFFER_ATR=${BREAKOUT_BREAK_BUFFER_ATR:-0.10}
      - BREAKOUT_BREAK_BUFFER_PCT=${BREAKOUT_BREAK_BUFFER_PCT:-0.0025}
      - BREAKOUT_OPENING_RANGE_MINUTES=${BREAKOUT_OPENING_RANGE_MINUTES:-30}
      - BREAKOUT_CONFIRMATION_BARS=${BREAKOUT_CONFIRMATION_BARS:-2}
      - BREAKOUT_MAX_CHASE_DISTANCE_ATR=${BREAKOUT_MAX_CHASE_DISTANCE_ATR:-2.0}
      - BREAKOUT_EVENT_TTL_SECONDS=${BREAKOUT_EVENT_TTL_SECONDS:-86400}
      - BREAKOUT_SCORING_VERSION=${BREAKOUT_SCORING_VERSION:-breakout-score-v1}
      - BREAKOUT_FEATURE_VERSION=${BREAKOUT_FEATURE_VERSION:-breakout-features-v1}
      - BREAKOUT_DETECTOR_VERSION=${BREAKOUT_DETECTOR_VERSION:-breakout-detector-v1}
      - BREAKOUT_API_SCHEMA_VERSION=${BREAKOUT_API_SCHEMA_VERSION:-breakout-api-v1}
      - RANGE_PERSISTENCE_MODE=${RANGE_PERSISTENCE_MODE:-shadow}
      - RANGE_PERSISTENCE_VERSION=${RANGE_PERSISTENCE_VERSION:-range-persistence-v1}
      - RANGE_PERSISTENCE_LENGTH=${RANGE_PERSISTENCE_LENGTH:-35}
      - RANGE_PERSISTENCE_FAST_LENGTH=${RANGE_PERSISTENCE_FAST_LENGTH:-3}
      - RANGE_PERSISTENCE_SLOPE_DAYS=${RANGE_PERSISTENCE_SLOPE_DAYS:-5}
      - RANGE_PERSISTENCE_RATIO_WINDOW=${RANGE_PERSISTENCE_RATIO_WINDOW:-10}
      - RANGE_PERSISTENCE_RATIO_THRESHOLD=${RANGE_PERSISTENCE_RATIO_THRESHOLD:-60}
      - RANGE_PERSISTENCE_MIN_HISTORY_MULTIPLIER=${RANGE_PERSISTENCE_MIN_HISTORY_MULTIPLIER:-5}
      - RANGE_PERSISTENCE_TREND_FAMILY_WEIGHT=${RANGE_PERSISTENCE_TREND_FAMILY_WEIGHT:-0.15}
      - RANGE_PERSISTENCE_FINAL_WEIGHT_CAP=${RANGE_PERSISTENCE_FINAL_WEIGHT_CAP:-0.04}
      - RANGE_PERSISTENCE_BREAKOUT_INTERACTION_ENABLED=${RANGE_PERSISTENCE_BREAKOUT_INTERACTION_ENABLED:-false}
      - RANGE_PERSISTENCE_BREAKOUT_INTERACTION_CAP=${RANGE_PERSISTENCE_BREAKOUT_INTERACTION_CAP:-4.0}
    command:
      - /bin/sh
      - -ec
      - |
        case "$${BREAKOUT_RADAR_ENABLED}" in
          1|true|TRUE|yes|YES|on|ON) exec python -m app.services.breakouts.worker ;;
          *) exec python -c 'import signal; signal.pause()' ;;
        esac
    volumes:
      - optix-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.breakouts.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  optix-data:
