x-optix-compose-entrypoint: "${OPTIX_COMPOSE_ENTRYPOINT:?Use ./scripts/compose.sh to run the formal Compose project.}"
x-optix-compose-env-files: "${COMPOSE_ENV_FILES:?Use ./scripts/compose.sh so machine.env participates in Compose interpolation.}"

x-optix-image: &optix-image
  image: "option-pro:${APP_COMMIT:-local}"
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      APP_VERSION: "${APP_VERSION:-dev}"
      APP_COMMIT: "${APP_COMMIT:-unknown}"

x-optix-runtime: &optix-runtime
  <<: *optix-image
  init: true
  env_file:
    - path: .env
      required: false
    - path: machine.env
      required: false
    - path: secrets.env
      required: false
  environment:
    APP_VERSION: "${APP_VERSION:-dev}"
    APP_COMMIT: "${APP_COMMIT:-unknown}"
    # Machine settings are resolved from .env,machine.env for interpolation.
    # Listing them explicitly keeps migration-era entries in secrets.env from
    # overriding the canonical machine file inside the container.
    HOST_BIND: "${HOST_BIND:-127.0.0.1}"
    PORT: "${PORT:-2000}"
    MACROLENS_URL: "${MACROLENS_URL:-}"
    ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
    TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
    TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
    # The named volume is the only persistent root. Exported test overrides
    # remain available, but they must stay at /data or below.
    DATA_DIR: "${DATA_DIR:-/data}"
  volumes:
    - optix-data:/data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  stop_grace_period: 60s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  backend:
    <<: *optix-runtime
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-2000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    <<: *optix-runtime
    stop_grace_period: 2100s
    command:
      - python
      - -m
      - app.worker
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  optix-data:
