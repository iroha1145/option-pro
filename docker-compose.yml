      - python
      - -m
      - app.services.breakouts.worker
    volumes:
      - optix-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.breakouts.worker", "--healthcheck"]
      interval: 30s
