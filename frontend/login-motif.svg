<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 登录页主视觉：点阵地球/筹码塔 + 手绘 K 线穿越 · 研报封面质感 -->
  <defs>
    <pattern id="motif-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#182338" opacity="0.32"/>
    </pattern>
    <clipPath id="globe-clip">
      <circle cx="430" cy="430" r="238"/>
    </clipPath>
  </defs>

  <!-- 点阵地球 -->
  <g clip-path="url(#globe-clip)">
    <rect x="192" y="192" width="476" height="476" fill="url(#motif-dots)"/>
    <!-- 大陆留白轮廓（墨线勾勒） -->
    <g stroke="#182338" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="#F6F5F1">
      <path d="M300 300c34-26 84-30 112-12 20 13 14 38-6 48-26 13-20 40-44 52-22 11-52-2-62-26-9-21-18-44 0-62Z"/>
      <path d="M430 480c26-10 58 0 64 24 5 22-14 44-38 42-22-2-38-22-36-42 1-10 4-19 10-24Z"/>
      <path d="M500 330c30-16 72-12 90 10 14 18 2 42-22 48-28 7-62-6-72-28-5-11-3-23 4-30Z"/>
    </g>
  </g>
  <!-- 地球外圈 -->
  <circle cx="430" cy="430" r="238" stroke="#182338" stroke-width="1.6" fill="none"/>
  <ellipse cx="430" cy="430" rx="238" ry="96" stroke="#182338" stroke-width="1.6" fill="none" opacity="0.45"/>
  <path d="M430 192v476" stroke="#182338" stroke-width="1.6" opacity="0.3"/>

  <!-- 筹码塔（右侧） -->
  <g stroke="#182338" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="880" cy="640" rx="118" ry="30"/>
    <path d="M762 640v-44M998 640v-44" opacity="0.8"/>
    <ellipse cx="880" cy="596" rx="118" ry="30"/>
    <path d="M774 566v-40M986 566v-40" opacity="0.8"/>
    <ellipse cx="880" cy="526" rx="106" ry="27"/>
    <path d="M788 500v-38M972 500v-38" opacity="0.8"/>
    <ellipse cx="880" cy="462" rx="92" ry="24"/>
  </g>
  <!-- 塔顶棱镜 O -->
  <g stroke="#2E46E0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="880" cy="392" r="42"/>
    <path d="M880 350l22 24-21 20-23-19 22-25Z" opacity="0.85"/>
  </g>

  <!-- 手绘 K 线穿越（brand 蓝） -->
  <g stroke="#2E46E0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 640 300 560l96 44 120-110 108 56 130-96 120 40 76-60"/>
    <path d="M1030 374l44-34M1050 408l24-68" opacity="0.7"/>
  </g>
  <!-- K 线蜡烛 -->
  <g stroke="#2E46E0" stroke-width="1.6">
    <path d="M486 512v-20M486 556v16"/>
    <rect x="476" y="492" width="20" height="64" rx="3" fill="#F6F5F1"/>
    <path d="M716 452v-18M716 508v14"/>
    <rect x="706" y="434" width="20" height="74" rx="3" fill="#2E46E0" fill-opacity="0.14"/>
  </g>
  <!-- up 绿点缀：末端箭头 -->
  <path d="M1074 340l-2 22M1074 340l-20 6" stroke="#0E9F6E" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="1074" cy="340" r="5" fill="#0E9F6E"/>

  <!-- 脚注刻度 -->
  <g stroke="#182338" stroke-width="1.6" stroke-linecap="round" opacity="0.5">
    <path d="M150 760h120M150 778h72"/>
  </g>
</svg>
