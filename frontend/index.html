<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Optix Pro：面向个人投资研究的美股、期权与选股工作台。" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'" />
  <title>Optix Pro · 个人投资研究</title>
  <script src="./static/js/theme-init.js?v=20260713b"></script>
  <link rel="icon" href="./static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./static/css/optix-deck.css?v=20260713c" />
  <link rel="stylesheet" href="./static/css/optix-catalysts.css?v=20260713c" />
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>
  <div class="canvas-texture" aria-hidden="true"></div>

  <header class="deck-header">
    <div class="deck-header__row">
      <a href="#watchlist" class="brand" aria-label="Optix Pro 首页">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false">
            <circle cx="16" cy="16" r="12.5" class="brand__ring" />
            <circle cx="16" cy="16" r="7.5" class="brand__ring brand__ring--inner" />
            <line x1="16" y1="16" x2="25.5" y2="8.5" class="brand__needle" />
            <circle cx="16" cy="16" r="2.2" class="brand__pivot" />
          </svg>
        </span>
        <span class="brand__word">
          <strong>Optix<em>&thinsp;Pro</em></strong>
          <small class="mono">MARKET DESK · 投资研究</small>
        </span>
      </a>

      <nav class="deck-nav" aria-label="主导航">
        <a href="#watchlist"  data-route="watchlist"><span class="deck-nav__num mono" aria-hidden="true">01</span>自选</a>
        <a href="#screener"   data-route="screener"><span class="deck-nav__num mono" aria-hidden="true">02</span>选股</a>
        <a href="#breakouts"  data-route="breakouts"><span class="deck-nav__num mono" aria-hidden="true">03</span>突破雷达</a>
        <a href="#sectors"    data-route="sectors"><span class="deck-nav__num mono" aria-hidden="true">04</span>板块</a>
        <a href="#earnings"   data-route="earnings"><span class="deck-nav__num mono" aria-hidden="true">05</span>财报</a>
        <a href="#catalysts"  data-route="catalysts"><span class="deck-nav__num mono" aria-hidden="true">06</span>催化剂</a>
      </nav>

      <div class="deck-tools">
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换白天 / 夜间主题">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/></svg>
        </button>
        <button class="deck-search" type="button" id="search-toggle" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <span>搜索</span>
          <kbd class="mono">⌘K</kbd>
        </button>
        <div class="deck-clock" aria-label="市场时段">
          <span class="deck-clock__dot" aria-hidden="true"></span>
          <div class="deck-clock__copy">
            <time id="clock-bj" class="mono">--:--:--</time>
            <small id="market-phase">休市 · 纽约 --:--</small>
          </div>
        </div>
      </div>

      <button class="deck-menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-label="打开导航">
        <span></span><span></span>
      </button>
    </div>

    <div class="tape" aria-label="主要指数行情">
      <div class="tape__label mono" aria-hidden="true">INDEX</div>
      <div class="tape__viewport">
        <div class="tape__track" id="index-tape"></div>
      </div>
      <div class="tape__meta mono" id="tape-updated">行情加载中</div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="deck-foot">
    <p class="mono">OPTIX PRO — 延迟行情,仅供研究,不构成投资建议;接口未覆盖的能力如实留空,不以模拟数据填充。</p>
  </footer>

  <nav class="dock" aria-label="手机主导航">
    <a href="#watchlist" data-route="watchlist">自选</a>
    <a href="#screener" data-route="screener">选股</a>
    <a href="#breakouts" data-route="breakouts">雷达</a>
    <a href="#sectors" data-route="sectors">板块</a>
    <a href="#earnings" data-route="earnings">财报</a>
  </nav>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="搜索股票">
      <div class="palette__field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="palette-input" type="search" placeholder="搜索代码或公司,如 NVDA / 英伟达" autocomplete="off" />
        <kbd class="mono">ESC</kbd>
      </div>
      <div class="palette__results" id="palette-results"></div>
    </div>
  </div>

  <script src="./static/js/deck-api.js?v=20260713c"></script>
  <script src="./static/js/deck-ai-jobs.js?v=20260713c"></script>
  <script src="./static/js/deck-catalysts.js?v=20260713c"></script>
  <script src="./static/js/deck-app.js?v=20260713c"></script>
</body>
</html>
